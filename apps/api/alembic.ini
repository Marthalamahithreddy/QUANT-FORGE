# Alembic configuration for QuantForge.
#
# The database URL is deliberately NOT set here. `alembic/env.py` reads it from
# the application Settings (`QF_DATABASE_URL`), so migrations always target the
# same database as the API and no credential is ever committed to this file.
#
# Run from this directory (apps/api):
#     uv run alembic upgrade head
#     uv run alembic current
#     uv run alembic history
#     uv run alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = %(here)s/alembic

# Sortable, collision-free revision filenames: 0001_baseline.py
file_template = %%(rev)s_%%(slug)s

# Makes `import quantforge` resolve when Alembic is run without an editable
# install, e.g. straight from a checkout.
prepend_sys_path = %(here)s/src

path_separator = os

[post_write_hooks]
# Keep generated revisions formatted and lint-clean automatically. The formatter
# runs first because it normalises the header docstring, which the `Revises:`
# line leaves with trailing whitespace when a revision has no parent.
hooks = ruff_format,ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
